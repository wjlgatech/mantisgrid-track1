<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="560" viewBox="0 0 1160 560" font-family="Poppins,ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif">
  <rect width="1160" height="560" fill="#faf9f5"/>
  <text x="40" y="44" font-size="13" font-weight="700" letter-spacing="2.6" fill="#d97757">RCA AGENT — ARCHITECTURE · ONE CASE, ~1.3 SECONDS, $0.00</text>

  <!-- telemetry -->
  <text x="40" y="92" font-size="11" font-weight="700" letter-spacing="1.6" fill="#5c5b57">TELEMETRY (12 GB / bundle)</text>
  <g>
    <rect x="40" y="104" width="196" height="46" rx="8" fill="#fff" stroke="#e3e0d6"/>
    <text x="56" y="126" font-size="14" fill="#141413">metric_container</text><text x="56" y="142" font-size="11" fill="#5c5b57">265 MB/day · pods</text>
    <rect x="40" y="158" width="196" height="46" rx="8" fill="#fff" stroke="#e3e0d6"/>
    <text x="56" y="180" font-size="14" fill="#141413">metric_node</text><text x="56" y="196" font-size="11" fill="#5c5b57">21 MB/day · hosts</text>
    <rect x="40" y="212" width="196" height="46" rx="8" fill="#fff" stroke="#788c5d" stroke-width="2"/>
    <text x="56" y="234" font-size="14" fill="#141413">metric_service ★</text><text x="56" y="250" font-size="11" fill="#788c5d">1 MB/day · 44% of answers</text>
    <rect x="40" y="270" width="196" height="46" rx="8" fill="#f0eee6" stroke="#e3e0d6" stroke-dasharray="4 3"/>
    <text x="56" y="292" font-size="14" fill="#5c5b57">trace_span</text><text x="56" y="308" font-size="11" fill="#5c5b57">1.3 GB/day · OFF</text>
  </g>

  <!-- flowing data dots -->
  <circle r="4" fill="#d97757"><animateMotion dur="2.4s" repeatCount="indefinite" path="M 240 127 L 320 200"/></circle>
  <circle r="4" fill="#d97757"><animateMotion dur="2.4s" begin="0.6s" repeatCount="indefinite" path="M 240 181 L 320 200"/></circle>
  <circle r="4" fill="#788c5d"><animateMotion dur="2.4s" begin="1.2s" repeatCount="indefinite" path="M 240 235 L 320 200"/></circle>

  <!-- window -->
  <rect x="320" y="150" width="150" height="100" rx="10" fill="#fff" stroke="#e3e0d6"/>
  <text x="340" y="180" font-size="14" font-weight="700" fill="#141413">Window</text>
  <text x="340" y="200" font-size="11" fill="#5c5b57">30 min, UTC+8</text>
  <text x="340" y="217" font-size="11" fill="#5c5b57">chunked read</text>
  <text x="340" y="238" font-size="11" fill="#d97757" font-weight="700">+0.092 (the tz fix)</text>

  <path d="M 470 200 L 530 200" stroke="#141413" stroke-width="2"/><path d="M 530 200 l -9 -5 v 10 z" fill="#141413"/>

  <!-- z score -->
  <rect x="534" y="140" width="164" height="120" rx="10" fill="#fff" stroke="#e3e0d6"/>
  <text x="552" y="168" font-size="14" font-weight="700" fill="#141413">Robust z</text>
  <text x="552" y="188" font-size="11" fill="#5c5b57">median + MAD vs</text>
  <text x="552" y="204" font-size="11" fill="#5c5b57">the rest of the day</text>
  <text x="552" y="226" font-size="11" fill="#5c5b57">per (component, KPI)</text>
  <text x="552" y="248" font-size="11" fill="#6a9bcc">percentile within source</text>

  <path d="M 698 200 L 758 200" stroke="#141413" stroke-width="2"/><path d="M 758 200 l -9 -5 v 10 z" fill="#141413"/>

  <!-- rank -->
  <rect x="762" y="140" width="164" height="120" rx="10" fill="#fff" stroke="#d97757" stroke-width="2"/>
  <text x="780" y="168" font-size="14" font-weight="700" fill="#141413">Rank + date</text>
  <text x="780" y="188" font-size="11" fill="#5c5b57">which = peak z</text>
  <text x="780" y="204" font-size="11" fill="#5c5b57">when = onset</text>
  <text x="780" y="226" font-size="11" fill="#5c5b57">reason = KPI → label</text>
  <text x="780" y="248" font-size="11" font-weight="700" fill="#d97757">← THE BOTTLENECK</text>
  <rect x="762" y="140" width="164" height="120" rx="10" fill="none" stroke="#d97757" stroke-width="2" opacity="0">
    <animate attributeName="opacity" values="0;0.85;0" dur="2s" repeatCount="indefinite"/>
  </rect>

  <path d="M 926 200 L 986 200" stroke="#141413" stroke-width="2"/><path d="M 986 200 l -9 -5 v 10 z" fill="#141413"/>

  <!-- outputs -->
  <rect x="990" y="120" width="140" height="62" rx="8" fill="#fff" stroke="#e3e0d6"/>
  <text x="1006" y="145" font-size="13" font-weight="700" fill="#141413">predictions</text>
  <text x="1006" y="163" font-size="11" fill="#5c5b57">.csv (scored)</text>
  <rect x="990" y="192" width="140" height="70" rx="8" fill="#fff" stroke="#e3e0d6"/>
  <text x="1006" y="216" font-size="13" font-weight="700" fill="#141413">evidence/*.md</text>
  <text x="1006" y="234" font-size="11" fill="#5c5b57">numbers compiled,</text>
  <text x="1006" y="250" font-size="11" fill="#5c5b57">never generated</text>

  <!-- GLM judge -->
  <path d="M 1060 262 L 1060 330" stroke="#6a9bcc" stroke-width="2" stroke-dasharray="5 4"/>
  <path d="M 1060 330 l -5 -9 h 10 z" fill="#6a9bcc"/>
  <circle r="4" fill="#6a9bcc"><animateMotion dur="1.8s" repeatCount="indefinite" path="M 1060 266 L 1060 326"/></circle>
  <rect x="820" y="336" width="310" height="86" rx="10" fill="#fff" stroke="#6a9bcc" stroke-width="2"/>
  <text x="840" y="362" font-size="14" font-weight="700" fill="#141413">GLM-5.2 judges the evidence</text>
  <text x="840" y="382" font-size="11" fill="#5c5b57">grounding · calibration · ruled-out · actionability</text>
  <text x="840" y="402" font-size="11" fill="#6a9bcc" font-weight="700">the only model call · 15.7s · $0.0048</text>

  <!-- no-model band -->
  <rect x="320" y="440" width="606" height="52" rx="10" fill="#f0eee6" stroke="#e3e0d6"/>
  <text x="340" y="465" font-size="13" font-weight="700" fill="#141413">No model decides the answer</text>
  <text x="340" y="483" font-size="11" fill="#5c5b57">measured twice: GLM changed 0 of 20 answers, under opposite retrieval conditions</text>

  <text x="40" y="530" font-size="11" fill="#5c5b57">0.199 on 70 dev cases (baseline 0.073) · 1.3 s/case · $0.00 in the judged run · 20 cases fit 1.2 min of a 20-min wall</text>
</svg>
