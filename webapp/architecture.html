<div class="wrap">
  <h2>Architecture — one case, ~1.3 seconds, $0.00</h2>
  <figure><object type="image/svg+xml" data="/static/architecture.svg"></object>
  <figcaption>Three metric sensors feed one robust z-score, ranked and dated. No model decides the
  answer — measured twice, GLM changed 0 of 20 answers. GLM's one job is judging the evidence, where
  no deterministic scorer exists.</figcaption></figure>

  <h2>Where the accuracy goes, and where it is stuck</h2>
  <figure><object type="image/svg+xml" data="/static/bottleneck.svg"></object>
  <figcaption>v1 could not say 46% of the correct answers at all. Adding metric_service.csv (1 MB/day)
  took reachability to 96.3% — retrieval solved. The answer is now in our top three 39% of the time
  and we pick the wrong one. The blocker is merging sensors whose scores are not comparable.</figcaption></figure>
